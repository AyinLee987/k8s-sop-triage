# Generated by boutique/make_hard_scenarios.py — do not edit by hand.
scenarios:
- id: BH01
  app: boutique
  split: dev
  kind: cross_service
  mechanism: double
  hard: double
  root_causes: 2
  symptom: 有用户反馈商城变慢了，另外还有人说下单失败、订单提交不了。
  realism:
    pattern: 两个互不相关的故障同时存在：一个服务的 Pod 网络延迟，加上下单链路上的一个地址配置错误。只报其中一个不算对。
    sources:
    - Cloud-OpsBench
    - k8s.af
    validated: false
    validate_note: 确认每个故障都生效；延迟和丢包场景确认被注入的 Pod 仍是 Ready、重启次数为 0（丢包会影响探针，留意 Unhealthy 事件）。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/checkoutservice
    - PAYMENT_SERVICE_ADDR=paymentservice:50052
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/checkoutservice
    - --timeout=140s
  - sleep: 25
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - apply
    - -f
    - '{repo}/scenarios/netem/injector-boutique-hard-BH01.yaml'
  - kubectl:
    - -n
    - infra-tools
    - wait
    - --for=condition=Ready
    - pod/net-injector
    - --timeout=180s
  confirm:
    timeout_s: 180
    checks:
    - type: slow_requests
      selector: app=frontend
      field: http.resp.took_ms
      match:
        message: request complete
      min_ms: 180
      count: 15
    - &id001
      type: logs_contain
      selector: app=frontend
      text: failed to complete the order
    - type: logs_contain
      namespace: infra-tools
      selector: app=net-injector
      text: 'netem applied: 1'
    debug_on_fail:
    - - -n
      - infra-tools
      - logs
      - net-injector
      - --tail=20
    - - -n
      - '{ns}'
      - logs
      - -l
      - app=frontend
      - --tail=6
    - - -n
      - '{ns}'
      - get
      - pods
      - -o
      - wide
  reset:
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/checkoutservice
    - PAYMENT_SERVICE_ADDR=paymentservice:50051
  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Deployment
      name: checkoutservice
    explanation: checkoutservice 的环境变量 PAYMENT_SERVICE_ADDR 被改成 paymentservice:50052（应为 paymentservice:50051），调不到 paymentservice；paymentservice 自身没有问题。
    key_evidence:
    - '50052'
    accept_cause_keywords:
    - payment_service_addr
    - 环境变量
    - env
    also:
    - object:
        kind: Pod
        name: currencyservice
      accept_objects:
      - currencyservice
      explanation: currencyservice 的 Pod 网络被加了约 200ms 延迟；它自身处理不慢，调用它的服务跟着变慢。
      key_evidence:
      - currencyservice
      accept_cause_keywords:
      - 网络
      - network
      - 延迟
      - latency
      - delay
