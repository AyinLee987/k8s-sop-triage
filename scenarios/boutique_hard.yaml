  symptom: 商城页面明显变慢了，但没有报错；Pod 看起来都是正常的。
  realism:
    pattern: 真正的原因是 redis-cart 的 Pod 网络延迟。同时它的直接调用方 cartservice 刚好做了一次无害的发布（多了一个 RELEASE_TAG 环境变量）：“刚发布过、又正好变慢”很容易被当成原因。
    sources:
    - Cloud-OpsBench
    - k8s.af
    validated: false
    validate_note: 确认每个故障都生效；延迟和丢包场景确认被注入的 Pod 仍是 Ready、重启次数为 0（丢包会影响探针，留意 Unhealthy 事件）。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/cartservice
    - RELEASE_TAG=2026.11.16-2
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/cartservice
    - --timeout=140s
  - sleep: 25
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - apply
    - -f
    - '{repo}/scenarios/netem/injector-boutique-hard-BH08.yaml'
  - kubectl:
    - -n
    - infra-tools
    - wait
    - --for=condition=Ready
    - pod/net-injector
    - --timeout=180s
  confirm:
    timeout_s: 180
    checks:
    - type: slow_requests
      selector: app=frontend
      field: http.resp.took_ms
      match:
        message: request complete
      min_ms: 180
      count: 15
    - type: logs_contain
      namespace: infra-tools
      selector: app=net-injector
      text: 'netem applied: 1'
    debug_on_fail:
    - - -n
      - infra-tools
      - logs
      - net-injector
      - --tail=20
    - - -n
      - '{ns}'
      - logs
      - -l
      - app=frontend
      - --tail=6
    - - -n
      - '{ns}'
      - get
      - pods
      - -o
      - wide
  reset:
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/cartservice
    - RELEASE_TAG-
  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Pod
      name: redis-cart
    accept_objects:
    - redis-cart
    explanation: redis-cart 的 Pod 网络被加了约 300ms 延迟；它自身处理不慢，调用它的服务跟着变慢。
    key_evidence:
    - redis-cart
    accept_cause_keywords:
    - 网络
    - network
    - 延迟
    - latency
    - delay
    not_cause:
    - name: cartservice
      why: 只是多了一个不起作用的环境变量，发布前后它自身的处理时间没有变化
