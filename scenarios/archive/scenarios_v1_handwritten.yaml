# 场景规格。只有执行器（triage.lifecycle）和评分器（triage.grader）读取这个文件。
# 诊断器只能拿到 symptom 字符串和只读工具，看不到这里的 id、注入方式和答案。
#
# 每个场景写明八项：正常状态(baseline)、注入动作(inject)、初始症状(symptom)、
# 正确故障对象(answer.object)、原因解释(answer.explanation)、关键证据(answer.key_evidence)、
# 可接受的等价答案(answer.accept_*)、复位条件(reset + 通用健康检查)。
#
# 划分按故障机制：同一种机制只出现在一个集合里。
#   dev（开发集，也是回归集）：S01 S02 S03 S04 S07
#   holdout（保留测试集，定稿前不看结果、不调参）：S05 S06 S08 S09 S10
#
# 模板变量：{ns} 业务命名空间；{lab_k8s} tiktok-k8s-lab/k8s 目录；{repo} 本仓库根目录。

baseline: >
  命名空间 {ns} 内 Deployment api 2/2、worker 1/1 可用，StatefulSet redis 1/1 就绪，
  所有 Pod Ready 且没有等待原因；不存在命名空间 rec-feature。

scenarios:
  - id: S01
    split: dev
    kind: single_evidence
    symptom: "刚发布了 api 的新版本，发布一直卡着没完成，新 Pod 起不来。"
    inject:
      - kubectl: ["-n", "{ns}", "set", "image", "deployment/api", "api=tiktok-k8s-lab:v1-hotfix"]
    confirm:
      timeout_s: 90
      checks:
        - {type: pod_waiting_reason, selector: "app=api", reasons: [ErrImageNeverPull, ErrImagePull, ImagePullBackOff]}
    reset:
      - kubectl: ["-n", "{ns}", "set", "image", "deployment/api", "api=tiktok-k8s-lab:v1"]
    answer:
      status: root_cause_found
      object: {kind: Deployment, name: api}
      cause_category: image_unavailable
      explanation: "镜像标签 v1-hotfix 在节点上不存在（imagePullPolicy: Never），新 Pod 停在 ErrImageNeverPull。"
      key_evidence: ["v1-hotfix", "ErrImageNeverPull", "ImagePullBackOff", "ErrImagePull"]
      accept_cause_keywords: ["镜像", "image", "v1-hotfix"]

  - id: S02
    split: dev
    kind: running_but_broken
    symptom: "接口能正常提交事件，但事件一直停在 queued 状态，用户点击数不增长。"
    inject:
      - kubectl: ["-n", "{ns}", "set", "env", "deployment/worker", "REDIS_HOST=redis-primary"]
    confirm:
      timeout_s: 120
      checks:
        - {type: logs_contain, selector: "app=worker", text: "redis_retry"}
    reset:
      - kubectl: ["-n", "{ns}", "set", "env", "deployment/worker", "REDIS_HOST-"]
    answer:
      status: root_cause_found
      object: {kind: Deployment, name: worker}
      cause_category: dependency_unreachable
      explanation: "worker 的环境变量 REDIS_HOST 被覆盖成不存在的 redis-primary，连接 Redis 失败并不断重试。"
      key_evidence: ["redis-primary", "REDIS_HOST", "ConnectionError", "redis_retry"]
      accept_cause_keywords: ["REDIS_HOST", "redis-primary", "地址", "host"]

  - id: S03
    split: dev
    kind: same_symptom_diff_cause
    symptom: "worker 一直在重启，事件堆积处理不掉。"
    inject:
      - kubectl: ["-n", "{ns}", "set", "env", "deployment/worker", "PROCESSING_DELAY_MS=20000"]
    confirm:
      timeout_s: 120
      checks:
        - {type: pod_restart_count_at_least, selector: "app=worker", count: 2}
    reset:
      - kubectl: ["-n", "{ns}", "set", "env", "deployment/worker", "PROCESSING_DELAY_MS-"]
    answer:
      status: root_cause_found
      object: {kind: Deployment, name: worker}
      cause_category: invalid_config_value
      explanation: "PROCESSING_DELAY_MS=20000 超出 0..10000，worker 启动校验抛出 ValueError 退出。"
      key_evidence: ["PROCESSING_DELAY_MS", "20000", "must be within", "ValueError"]
      accept_cause_keywords: ["PROCESSING_DELAY_MS", "配置", "config"]

  - id: S04
    split: dev
    kind: same_symptom_diff_cause
    symptom: "worker 一直在重启，事件堆积处理不掉。"
    inject:
      - kubectl: ["-n", "{ns}", "set", "resources", "deployment/worker", "-c", "worker", "--limits=memory=16Mi", "--requests=memory=16Mi"]
    confirm:
      timeout_s: 120
      checks:
        - {type: pod_last_terminated_reason, selector: "app=worker", reason: OOMKilled}
    reset:
      - kubectl: ["-n", "{ns}", "set", "resources", "deployment/worker", "-c", "worker", "--limits=cpu=500m,memory=128Mi", "--requests=cpu=100m,memory=64Mi"]
    answer:
      status: root_cause_found
      object: {kind: Deployment, name: worker}
      cause_category: memory_limit_too_low
      explanation: "worker 内存限制被改成 16Mi，进程启动即被 OOMKilled。"
      key_evidence: ["OOMKilled", "16Mi"]
      accept_cause_keywords: ["内存", "memory", "OOM"]

  - id: S05
    split: holdout
    kind: same_symptom_diff_cause
    symptom: "worker 一直在重启，事件堆积处理不掉。"
    precheck:
      - {type: jsonpath_equals, resource: "deployment/worker", path: "{.spec.template.spec.containers[0].command[2]}", value: "app.worker"}
    inject:
      - kubectl: ["-n", "{ns}", "patch", "deployment/worker", "--type=json", "-p", '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["python","-m","app.workers"]}]']
    confirm:
      timeout_s: 120
      checks:
        - {type: pod_restart_count_at_least, selector: "app=worker", count: 2}
    reset:
      - kubectl: ["-n", "{ns}", "patch", "deployment/worker", "--type=json", "-p", '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["python","-m","app.worker"]}]']
    answer:
      status: root_cause_found
      object: {kind: Deployment, name: worker}
      cause_category: wrong_command
      explanation: "启动命令里的模块名被改成 app.workers，Python 报 No module named。"
      key_evidence: ["app.workers", "No module named"]
      accept_cause_keywords: ["命令", "command", "模块", "module", "app.workers"]

  - id: S06
    split: holdout
    kind: same_symptom_diff_cause
    symptom: "api 的 Pod 隔一会儿就自己重启一次。"
    precheck:
      - {type: jsonpath_equals, resource: "deployment/api", path: "{.spec.template.spec.containers[0].livenessProbe.httpGet.path}", value: "/health/live"}
    inject:
      - kubectl: ["-n", "{ns}", "patch", "deployment/api", "--type=json", "-p", '[{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/path","value":"/healthz"}]']
    confirm:
      timeout_s: 150
      checks:
        - {type: pod_restart_count_at_least, selector: "app=api", count: 1}
    reset:
      - kubectl: ["-n", "{ns}", "patch", "deployment/api", "--type=json", "-p", '[{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/httpGet/path","value":"/health/live"}]']
    answer:
      status: root_cause_found
      object: {kind: Deployment, name: api}
      cause_category: probe_misconfigured
      explanation: "存活探针路径被改成不存在的 /healthz，返回 404，容器被 kubelet 反复重启。"
      key_evidence: ["/healthz", "Liveness probe failed", "404"]
      accept_cause_keywords: ["探针", "probe", "liveness", "/healthz"]

  - id: S07
    split: dev
    kind: normal
    symptom: "有用户说页面偶尔有点慢，帮忙看下这个命名空间的服务有没有异常。"
    inject: []
    confirm:
      timeout_s: 10
      checks:
        - {type: always}
    reset: []
    answer:
      status: no_fault_found
      object: null
      cause_category: no_fault
      explanation: "没有注入故障，所有工作负载健康。"
      key_evidence: []
      accept_cause_keywords: []

  - id: S08
    split: holdout
    kind: insufficient_evidence
    symptom: "rec-feature 命名空间里的 feature-sync 服务一直在报错，帮忙查下原因。"
    inject:
      - kubectl: ["apply", "-f", "{repo}/k8s/restricted-ns.yaml"]
    confirm:
      timeout_s: 120
      checks:
        - {type: pod_restart_count_at_least, selector: "app=feature-sync", count: 1, namespace: rec-feature}
    reset:
      - kubectl: ["delete", "namespace", "rec-feature", "--wait=true", "--timeout=120s"]
    answer:
      status: undetermined
      object: null
      cause_category: other
      explanation: "诊断器没有 rec-feature 命名空间的读权限，正确做法是说明无法确定并指出缺少权限。"
      key_evidence: ["forbidden"]
      accept_unknowns_keywords: ["权限", "forbidden", "rec-feature", "permission"]

  - id: S09
    split: holdout
    kind: sop_not_covered
    symptom: "集群里其他服务调用 api 一直连不上，但 api 的 Pod 看起来都是 Running。"
    inject:
      - kubectl: ["-n", "{ns}", "patch", "service/api", "-p", '{"spec":{"selector":{"app":"api-v2"}}}']
    confirm:
      timeout_s: 30
      checks:
        - {type: service_endpoints_empty, service: api}
    reset:
      - kubectl: ["-n", "{ns}", "patch", "service/api", "-p", '{"spec":{"selector":{"app":"api"}}}']
    answer:
      status: root_cause_found
      object: {kind: Service, name: api}
      cause_category: other
      explanation: "Service api 的 selector 被改成 app=api-v2，选不中任何 Pod，Endpoints 为空。SOP 没覆盖 Service 层。"
      key_evidence: ["api-v2", "selector", "endpoints"]
      accept_cause_keywords: ["selector", "选择器", "endpoint", "api-v2", "标签"]

  - id: S10
    split: holdout
    kind: running_but_broken
    symptom: "接口能正常提交事件，但事件一直停在 queued 状态，用户点击数不增长。"
    precheck:
      - {type: jsonpath_equals, resource: "deployment/worker", path: "{.spec.template.spec.containers[0].env[0].name}", value: "REDIS_PASSWORD"}
    inject:
      - kubectl: ["-n", "{ns}", "patch", "deployment/worker", "--type=json", "-p", '[{"op":"replace","path":"/spec/template/spec/containers/0/env/0","value":{"name":"REDIS_PASSWORD","value":"changeme"}}]']
    confirm:
      timeout_s: 120
      checks:
        - {type: logs_contain, selector: "app=worker", text: "AuthenticationError"}
    reset:
      - kubectl: ["-n", "{ns}", "patch", "deployment/worker", "--type=json", "-p", '[{"op":"replace","path":"/spec/template/spec/containers/0/env/0","value":{"name":"REDIS_PASSWORD","valueFrom":{"secretKeyRef":{"name":"redis-auth","key":"password"}}}}]']
    answer:
      status: root_cause_found
      object: {kind: Deployment, name: worker}
      cause_category: dependency_auth_failed
      explanation: "worker 的 REDIS_PASSWORD 被改成字面值 changeme，不再引用 Secret，连接 Redis 认证失败。"
      key_evidence: ["AuthenticationError", "REDIS_PASSWORD", "changeme"]
      accept_cause_keywords: ["密码", "password", "认证", "auth"]

  # ---- 跨组件场景：现象在 A，根因在 B（S11、S12 开发集；S13、S14 保留测试集）----
  - id: S11
    split: dev
    kind: cross_component
    symptom: 提交事件的接口一直返回 503，点击数也不涨了。
    inject:
    - kubectl:
      - -n
      - '{ns}'
      - patch
      - configmap/redis-config
      - --type=merge
      - -p
      - '{"data": {"redis.conf": "bind 0.0.0.0\nprotected-mode yes\nport 6379\ndir /data\nappendonly yes\nappendfsync everysec\nsave \"\"\nmaxmemory 512kb\nmaxmemory-policy noeviction\ninclude /etc/redis-auth/redis-auth.conf\n"}}'
    - &id001
      kubectl:
      - -n
      - '{ns}'
      - delete
      - pod
      - redis-0
      - --wait=true
      - --timeout=90s
    - &id002
      kubectl:
      - -n
      - '{ns}'
      - rollout
      - status
      - statefulset/redis
      - --timeout=150s
    - kubectl:
      - -n
      - '{ns}'
      - exec
      - deployment/api
      - -c
      - api
      - --
      - python
      - -c
      - "import json,uuid,urllib.request as u\nfor i in range(5):\n    r=u.Request('http://127.0.0.1:8000/events',data=json.dumps({'event_id':str(uuid.uuid4()),'user_id':'probe','event_type':'click'}).encode(),headers={'Content-Type':'application/json'})\n    try: print(u.urlopen(r,timeout=3).status)\n    except Exception as e: print(getattr(e,'code',type(e).__name__))\n"
    confirm:
      timeout_s: 60
      checks:
      - type: logs_contain
        selector: app=api
        text: redis_unavailable
    reset:
    - kubectl:
      - -n
      - '{ns}'
      - patch
      - configmap/redis-config
      - --type=merge
      - -p
      - '{"data": {"redis.conf": "bind 0.0.0.0\nprotected-mode yes\nport 6379\ndir /data\nappendonly yes\nappendfsync everysec\nsave \"\"\nmaxmemory 192mb\nmaxmemory-policy noeviction\ninclude /etc/redis-auth/redis-auth.conf\n"}}'
    - *id001
    - *id002
    answer:
      status: root_cause_found
      object:
        kind: StatefulSet
        name: redis
      accept_objects:
      - redis
      - redis-config
      symptom_objects:
      - api
      - worker
      cause_category: dependency_memory_full
      explanation: redis-config 里的 maxmemory 被改成 512kb，低于 Redis 已用内存，所有写入被拒绝（OOM command not allowed）；api 写入失败返回 503。现象在 api，根因在 Redis 配置。
      key_evidence:
      - maxmemory
      - 512kb
      - OutOfMemoryError
      - OOM
      accept_cause_keywords:
      - maxmemory
      - 内存
      - memory
      - OOM
  - id: S12
    split: dev
    kind: cross_component
    symptom: 服务整个不可用：api 全部不 Ready，提交不了事件，worker 也停止处理了。
    inject:
    - kubectl:
      - -n
      - '{ns}'
      - scale
      - statefulset/redis
      - --replicas=0
    - kubectl:
      - -n
      - '{ns}'
      - wait
      - --for=delete
      - pod/redis-0
      - --timeout=90s
    confirm:
      timeout_s: 60
      checks:
      - type: pod_not_ready
        selector: app=api
    reset:
    - kubectl:
      - -n
      - '{ns}'
      - scale
      - statefulset/redis
      - --replicas=1
    - *id002
    answer:
      status: root_cause_found
      object:
        kind: StatefulSet
        name: redis
      accept_objects:
      - redis
      symptom_objects:
      - api
      - worker
      cause_category: dependency_down
      explanation: StatefulSet redis 的副本数被缩成 0，Redis 不在运行；api 就绪探针 ping 失败全部不 Ready，worker 连接失败重试。现象在 api / worker，根因在 Redis。
      key_evidence:
      - desired
      - replicas
      - 副本
      - 0/0
      accept_cause_keywords:
      - 副本
      - replica
      - 缩
      - scale
      - 没有运行
      - 不在运行
  - id: S13
    split: holdout
    kind: cross_component
    symptom: 服务整个不可用：api 全部不 Ready，提交不了事件，worker 也停止处理了。
    inject:
    - kubectl:
      - -n
      - '{ns}'
      - patch
      - configmap/redis-config
      - --type=merge
      - -p
      - '{"data": {"redis.conf": "bind 0.0.0.0\nprotected-mode yes\nport 6379\ndir /data\nappendonly yes\nappendfsync everysec\nsave \"\"\nmaxmemory 192mb\nmaxmemory-policy noeviction\ninclude /etc/redis-auth/redis-auth.conf\nrequirepass rotated-by-config-change\n"}}'
    - *id001
    confirm:
      timeout_s: 120
      checks:
      - type: pod_not_ready
        selector: app=redis
      - type: pod_not_ready
        selector: app=api
    reset:
    - kubectl:
      - -n
      - '{ns}'
      - patch
      - configmap/redis-config
      - --type=merge
      - -p
      - '{"data": {"redis.conf": "bind 0.0.0.0\nprotected-mode yes\nport 6379\ndir /data\nappendonly yes\nappendfsync everysec\nsave \"\"\nmaxmemory 192mb\nmaxmemory-policy noeviction\ninclude /etc/redis-auth/redis-auth.conf\n"}}'
    - *id001
    - *id002
    answer:
      status: root_cause_found
      object:
        kind: StatefulSet
        name: redis
      accept_objects:
      - redis
      - redis-config
      symptom_objects:
      - api
      - worker
      cause_category: dependency_config_error
      explanation: redis-config 在 include 之后多了一行 requirepass，覆盖了 Secret 里的密码；Redis 自己的就绪探针认证失败，Pod 不就绪、被摘出 Service，api / worker 都连不上。现象在 api / worker，根因在 Redis 配置。
      key_evidence:
      - requirepass
      - redis-config
      - Readiness probe failed
      accept_cause_keywords:
      - requirepass
      - 密码
      - 认证
      - auth
      - redis-config
      - 配置
  - id: S14
    split: holdout
    kind: cross_component
    symptom: 点击数涨得特别慢，新提交的事件要等很久才变成 completed。
    inject:
    - kubectl:
      - -n
      - '{ns}'
      - set
      - env
      - deployment/worker
      - PROCESSING_DELAY_MS=10000
    - kubectl:
      - -n
      - '{ns}'
      - rollout
      - status
      - deployment/worker
      - --timeout=150s
    - kubectl:
      - -n
      - '{ns}'
      - exec
      - deployment/api
      - -c
      - api
      - --
      - python
      - -c
      - "import json,uuid,urllib.request as u\nfor i in range(12):\n    r=u.Request('http://127.0.0.1:8000/events',data=json.dumps({'event_id':str(uuid.uuid4()),'user_id':'probe','event_type':'click'}).encode(),headers={'Content-Type':'application/json'})\n    try: print(u.urlopen(r,timeout=3).status)\n    except Exception as e: print(getattr(e,'code',type(e).__name__))\n"
    confirm:
      timeout_s: 90
      checks:
      - type: logs_contain
        selector: app=worker
        text: committed
    reset:
    - kubectl:
      - -n
      - '{ns}'
      - set
      - env
      - deployment/worker
      - PROCESSING_DELAY_MS-
    answer:
      status: root_cause_found
      object:
        kind: Deployment
        name: worker
      accept_objects:
      - worker
      symptom_objects:
      - api
      cause_category: processing_too_slow
      explanation: worker 的 PROCESSING_DELAY_MS 被设成 10000（合法上限），每条事件处理 10 秒，事件积压。现象在用户侧 / api，根因在 worker 配置。
      key_evidence:
      - PROCESSING_DELAY_MS
      - '10000'
      - elapsed_ms
      accept_cause_keywords:
      - PROCESSING_DELAY_MS
      - 处理
      - 慢
      - 延迟
      - delay
