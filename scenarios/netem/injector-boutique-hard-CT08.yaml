# Generated by boutique/make_hard_scenarios.py — do not edit by hand.
# Fault injector for CT08: tc netem on the pod interfaces of recommendationservice. kind nodes only; lives in a namespace the
# diagnosing agent cannot read, and leaves no trace on the cluster objects. The netem follows the targets when their pods are
# replaced. All qdiscs are removed when the pod stops, including when a later target fails.
apiVersion: v1
kind: Namespace
metadata:
  name: infra-tools
---
apiVersion: v1
kind: Pod
metadata:
  name: net-injector
  namespace: infra-tools
  labels:
    app: net-injector
spec:
  hostNetwork: true
  hostPID: true
  restartPolicy: Never
  terminationGracePeriodSeconds: 20
  tolerations:
  - operator: Exists
  containers:
  - name: injector
    image: tiktok-k8s-lab:v3
    imagePullPolicy: Never
    securityContext:
      privileged: true
      runAsUser: 0
    command:
    - sh
    - -c
    - |
      set -eu
      host() { nsenter -t 1 -m -u -n -i -- sh -c "$1"; }
      KC="kubectl --kubeconfig /etc/kubernetes/admin.conf -n boutique"
      DEVS=""
      cleanup() { for d in $DEVS; do host "tc qdisc del dev $d root" || true; done; }
      trap 'cleanup; exit 0' TERM INT
      trap 'cleanup' EXIT
      N=0
      for spec in "recommendationservice|delay 270ms 81ms"; do
        T=${spec%%|*}; ARGS=${spec#*|}
        # wait until the previous rollout's pods are gone: a terminating pod still reports phase Running
        i=0; while [ "$(host "$KC get pods -l app=$T -o name | wc -l")" != "1" ]; do i=$((i+1)); [ $i -gt 60 ] && { echo "$T pod did not settle"; exit 1; }; sleep 1; done
        POD=$(host "$KC get pods -l app=$T --sort-by=.metadata.name -o jsonpath='{.items[0].metadata.name}'")
        IP=$(host "$KC get pod $POD -o jsonpath='{.status.podIP}'")
        DEV=$(host "ip route get $IP" | sed -n 's/.* dev \([^ ]*\).*/\1/p')
        case "$DEV" in veth*) ;; *) echo "unexpected device '$DEV' for $IP"; exit 1;; esac
        DEVS="$DEVS $DEV"
        host "tc qdisc replace dev $DEV root netem $ARGS"
        echo "netem on $DEV ($POD $IP): $ARGS"; host "tc qdisc show dev $DEV"
        N=$((N+1))
      done
      echo "netem applied: $N"
      touch /tmp/ready
      # The fault follows the workload: when a target's pod is replaced (a restart, a rollout), the new pod's interface
      # gets the same netem. Otherwise any change that recreates the pod would "fix" the network and confirm whatever
      # theory led to that change.
      follow() {
        for spec in "recommendationservice|delay 270ms 81ms"; do
          T=${spec%%|*}; ARGS=${spec#*|}
          for IP in $(host "$KC get pods -l app=$T -o jsonpath='{.items[*].status.podIP}'" 2>/dev/null); do
            DEV=$(host "ip route get $IP" 2>/dev/null | sed -n 's/.* dev \([^ ]*\).*/\1/p')
            case "$DEV" in veth*) ;; *) continue;; esac
            if ! host "tc qdisc show dev $DEV" 2>/dev/null | grep -q netem; then
              case " $DEVS " in *" $DEV "*) ;; *) DEVS="$DEVS $DEV";; esac
              host "tc qdisc replace dev $DEV root netem $ARGS" && echo "netem re-applied on $DEV ($T $IP): $ARGS"
            fi
          done
        done
      }
      while :; do sleep 2; follow || true; done
    readinessProbe:
      exec:
        command: ["test", "-f", "/tmp/ready"]
      periodSeconds: 2
