- id: BG14
  template: netem
  target: recommendationservice
  app: boutique
  split: dev
  kind: cross_service
  mechanism: netem
  symptom: 商城页面明显变慢了，但没有报错；Pod 看起来都是正常的。
  decoy: cartservice
  realism:
    pattern: 'Pod 网络延迟（Cloud-OpsBench: pod_network_delay），集群对象上没有痕迹。 同时 cartservice 被加了一个无害的环境变量 RELEASE_TAG（一次无关的发布），作为干扰项。'
    sources:
    - Cloud-OpsBench
    validated: false
    validate_note: 确认故障生效；延迟类场景确认所有 Pod 仍是 Ready、没有重启。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/cartservice
    - RELEASE_TAG=2026.11.16-1
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/cartservice
    - --timeout=140s
  - sleep: 25
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - apply
    - -f
    - '{repo}/scenarios/netem/injector-boutique-recommendationservice.yaml'
  - kubectl:
    - -n
    - infra-tools
    - wait
    - --for=condition=Ready
    - pod/net-injector
    - --timeout=180s
  confirm: &id002
    timeout_s: 150
    checks:
    - type: slow_requests
      selector: app=frontend
      field: http.resp.took_ms
      match:
        message: request complete
      min_ms: 180
      count: 15
    debug_on_fail:
    - - -n
      - infra-tools
      - logs
      - net-injector
      - --tail=20
    - - -n
      - '{ns}'
      - get
      - pods
      - -o
      - wide
  reset:
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/cartservice
    - RELEASE_TAG-
  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Pod
      name: recommendationservice
    accept_objects:
    - recommendationservice
    explanation: recommendationservice 的 Pod 网络被加了约 200ms 延迟；它自身处理不慢，调用它的服务跟着变慢。
    key_evidence:
    - recommendationservice
    accept_cause_keywords:
    - 网络
    - network
    - 延迟
    - latency
    - delay
  pool: mine
