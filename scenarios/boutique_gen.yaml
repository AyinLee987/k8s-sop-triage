scenarios:
- id: BG01
  template: env_addr
  target: frontend
  app: boutique
  split: dev
  kind: cross_service
  mechanism: env_addr
  symptom: 有用户反馈商城出问题了：有的页面打不开或者操作失败，报 500 错误。
  decoy: shippingservice
  realism:
    pattern: '调用方的下游地址环境变量配错（Cloud-OpsBench: service_env_var_address_mismatch）。 同时 shippingservice 被加了一个无害的环境变量 RELEASE_TAG（一次无关的发布），作为干扰项。'
    sources:
    - Cloud-OpsBench
    validated: false
    validate_note: 确认故障生效；延迟类场景确认所有 Pod 仍是 Ready、没有重启。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/shippingservice
    - RELEASE_TAG=2026.11.16-1
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/shippingservice
    - --timeout=140s
  - sleep: 25
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/frontend
    - CHECKOUT_SERVICE_ADDR=checkoutservice:5051
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/frontend
    - --timeout=140s
  confirm: &id001
    timeout_s: 180
    checks:
    - type: logs_contain
      selector: app=frontend
      text: '"http.resp.status":500'
    debug_on_fail:
    - - -n
      - '{ns}'
      - logs
      - -l
      - app=frontend
      - --tail=6
    - - -n
      - '{ns}'
      - get
      - pods
      - -o
      - wide
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/frontend
    - CHECKOUT_SERVICE_ADDR=checkoutservice:5050
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/shippingservice
    - RELEASE_TAG-
  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Deployment
      name: frontend
    explanation: frontend 的环境变量 CHECKOUT_SERVICE_ADDR 被改成 checkoutservice:5051（应为 checkoutservice:5050），调不到 checkoutservice；checkoutservice 自身没有问题。
    key_evidence:
    - '5051'
    accept_cause_keywords:
    - checkout_service_addr
    - 环境变量
    - env
  pool: mine
