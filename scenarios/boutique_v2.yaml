    - object:
        kind: Deployment
        name: redis-cart
      mechanism: cpu
      explanation: Deployment redis-cart 的 CPU 上限被调到 3m（应为 125m），容器被限流，请求要排队等 CPU 才能被处理；网络没有问题。
      key_evidence:
      - 3m
      accept_cause_keywords:
      - cpu
