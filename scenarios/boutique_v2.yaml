    - PAYMENT_SERVICE_ADDR=emailservice:5000
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/checkoutservice
    - --timeout=140s
  - sleep: 25
  confirm:
    timeout_s: 180
    checks:
    - &id002
      type: logs_contain
