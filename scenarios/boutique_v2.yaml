- id: CT15
  pool: test
  app: boutique
  split: dev
  kind: cross_service
  mechanism: double
  hard: double
  root_causes: 2
  symptom: 商城页面明显变慢了，但没有报错；Pod 看起来都是正常的。
  realism:
    pattern: 两个机制不同的故障：productcatalogservice 被配置了人为延迟（环境变量 EXTRA_LATENCY），加上 cartservice 的 Pod 网络延迟。
    sources:
    - Cloud-OpsBench
    - k8s.af
    validated: false
    validate_note: 确认每个故障都生效；延迟和丢包场景确认被注入的 Pod 仍是 Ready、重启次数为 0（丢包会影响探针，留意 Unhealthy 事件）。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/productcatalogservice
    - EXTRA_LATENCY=300ms
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/productcatalogservice
    - --timeout=140s
  - sleep: 25
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - apply
    - -f
    - '{repo}/scenarios/netem/injector-boutique-hard-CT15.yaml'
  - kubectl:
    - -n
    - infra-tools
    - wait
    - --for=condition=Ready
    - pod/net-injector
    - --timeout=180s
  confirm:
    timeout_s: 180
    checks:
    - type: slow_requests
      selector: app=frontend
      field: http.resp.took_ms
      match:
        message: request complete
      min_ms: 180
      count: 15
      since_confirm: true
    - type: logs_contain
      namespace: infra-tools
      selector: app=net-injector
      text: 'netem applied: 1'
    debug_on_fail:
    - - -n
      - infra-tools
      - logs
      - net-injector
      - --tail=20
    - - -n
      - '{ns}'
      - logs
      - -l
      - app=frontend
      - --tail=6
    - - -n
      - '{ns}'
      - get
      - pods
      - -o
      - wide
  reset:
  - kubectl:
    - -n
    - infra-tools
    - delete
    - pod
    - net-injector
    - --ignore-not-found
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/productcatalogservice
    - EXTRA_LATENCY-
  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Deployment
      name: productcatalogservice
    explanation: productcatalogservice 的 Deployment 被加了环境变量 EXTRA_LATENCY=300ms，服务处理每个请求时主动等待 300 毫秒；网络和资源都没有问题。
    key_evidence:
    - EXTRA_LATENCY
    accept_cause_keywords:
    - extra_latency
    - 环境变量
    - env
    also:
    - object:
        kind: Pod
        name: cartservice
      accept_objects:
      - cartservice
      explanation: cartservice 的 Pod 网络被加了约 130ms 延迟；它自身处理不慢，调用它的服务跟着变慢。
      key_evidence:
      - cartservice
      accept_cause_keywords:
      - 网络
      - network
      - 延迟
      - latency
      - delay
  bank: 2
  mechanisms:
  - app_delay
  - net_delay
- id: CT16
  pool: test
  app: boutique
  split: dev
  kind: cross_service
  mechanism: double
  hard: double
  root_causes: 2
  symptom: 商城页面明显变慢了，但没有报错；Pod 看起来都是正常的。
  realism:
    pattern: 两个服务的 CPU 上限同时过低：currencyservice 和 redis-cart。没有任何网络故障。
    sources:
    - Cloud-OpsBench
    - k8s.af
    validated: false
    validate_note: CPU 上限的数值是暂定的：先用 scripts/sweep_cpu_limit.py 找到“明显变慢、但 Pod 仍然 Ready 且不重启”的值。再确认限流指标（scripts/pod_metrics.py）在故障期间不为 0。确认每个故障都生效；延迟和丢包场景确认被注入的 Pod 仍是 Ready、重启次数为 0（丢包会影响探针，留意 Unhealthy 事件）。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/currencyservice
    - --limits=cpu=10m
    - --requests=cpu=10m
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/currencyservice
    - --timeout=140s
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/redis-cart
    - --limits=cpu=3m
    - --requests=cpu=3m
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/redis-cart
    - --timeout=140s
  - sleep: 25
  confirm:
    timeout_s: 180
    checks:
    - type: slow_requests
      selector: app=frontend
      field: http.resp.took_ms
      match:
        message: request complete
      min_ms: 180
      count: 15
      since_confirm: true
    debug_on_fail:
    - - -n
      - infra-tools
      - logs
      - net-injector
      - --tail=20
    - - -n
      - '{ns}'
      - logs
      - -l
      - app=frontend
      - --tail=6
    - - -n
      - '{ns}'
      - get
      - pods
      - -o
      - wide
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/currencyservice
    - --limits=cpu=200m
    - --requests=cpu=100m
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/redis-cart
    - --limits=cpu=125m
    - --requests=cpu=70m
