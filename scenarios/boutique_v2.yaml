  - kubectl:
    - -n
    - '{ns}'
    - set
    - env
    - deployment/checkoutservice
    - PAYMENT_SERVICE_ADDR=paymentservice:50051
  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Deployment
      name: checkoutservice
    mechanism: config
    explanation: checkoutservice 的环境变量 PAYMENT_SERVICE_ADDR 被改成 emailservice:5000（应为 paymentservice:50051）：地址能解析、端口也是通的，但对面是 emailservice，不提供这个接口；paymentservice 和 emailservice 自身都没有问题。
