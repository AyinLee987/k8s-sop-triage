# Generated by boutique/make_hard_scenarios.py — do not edit by hand. Second bank: CL = learning (added to BH), CV = validation, CT = test.
# CT is not run or looked at until the method is fixed. Nothing here has been validated on a cluster yet.
scenarios:
- id: CL01
  pool: learn
  app: boutique
  split: dev
  kind: cross_service
  mechanism: cpu
  hard: cpu
  root_causes: 1
  symptom: 商城页面明显变慢了，但没有报错；Pod 看起来都是正常的。
  realism:
    pattern: 不是网络：currencyservice 的 CPU 上限被调得很低，容器被限流。配置本身是合法的，看不出错；要看容器的限流指标才能确定。
    sources:
    - Cloud-OpsBench
    - k8s.af
    validated: false
    validate_note: CPU 上限的数值是暂定的：先用 scripts/sweep_cpu_limit.py 找到“明显变慢、但 Pod 仍然 Ready 且不重启”的值。再确认限流指标（scripts/pod_metrics.py）在故障期间不为 0。确认每个故障都生效；延迟和丢包场景确认被注入的 Pod 仍是 Ready、重启次数为 0（丢包会影响探针，留意 Unhealthy 事件）。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/currencyservice
    - --limits=cpu=10m
    - --requests=cpu=10m
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/currencyservice
    - --timeout=140s
  - sleep: 25
  confirm:
    timeout_s: 180
    checks:
    - type: slow_requests
      selector: app=frontend
      field: http.resp.took_ms
      match:
        message: request complete
      min_ms: 180
      count: 15
      since_confirm: true
    debug_on_fail:
    - - -n
      - infra-tools
      - logs
      - net-injector
      - --tail=20
    - - -n
      - '{ns}'
      - logs
      - -l
      - app=frontend
      - --tail=6
    - - -n
      - '{ns}'
      - get
      - pods
      - -o
      - wide
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/currencyservice
    - --limits=cpu=200m
    - --requests=cpu=100m
  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Deployment
      name: currencyservice
    mechanism: cpu
    explanation: Deployment currencyservice 的 CPU 上限被调到 10m（应为 200m），容器被限流，请求要排队等 CPU 才能被处理；网络没有问题。
    key_evidence:
    - 10m
    accept_cause_keywords:
    - cpu
    - 限流
    - throttl
    - 上限
    - limit
  bank: 2
  mechanisms:
  - cpu
