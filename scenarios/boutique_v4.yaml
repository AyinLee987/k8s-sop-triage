  bank: 4
  kind: cross_service
  mechanism: config
  hard: release+lookalike+ambient+delayed+sidecar
  root_causes: 1
  symptom: 有用户反馈下单失败，订单提交不了；其它页面还能打开。这个情况大概从十几分钟前开始。
  settle_s: 120
  release:
    tag: 2026.11.25-5
    deployments:
    - checkoutservice
    - currencyservice
