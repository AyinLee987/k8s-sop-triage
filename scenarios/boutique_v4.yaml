    - -p
    - '{"spec": {"template": {"spec": {"containers": [{"name": "server", "env": [{"name": "RELEASE_TAG", "value": "2026.11.25-5"}]}, {"name": "log-shipper", "image": "us-central1-docker.pkg.dev/google-samples/microservices-demo/loadgenerator:v0.10.3",
      "imagePullPolicy": "IfNotPresent", "command": ["python3", "-u", "/opt/log-shipper/log_shipper.py"], "env": [{"name": "PYTHONDONTWRITEBYTECODE", "value": "1"}], "resources": {"requests": {"cpu": "20m",
      "memory": "32Mi"}, "limits": {"cpu": "20m", "memory": "64Mi"}}, "securityContext": {"allowPrivilegeEscalation": false, "capabilities": {"drop": ["ALL"]}, "privileged": false, "readOnlyRootFilesystem":
      true}, "volumeMounts": [{"name": "log-shipper", "mountPath": "/opt/log-shipper", "readOnly": true}]}], "volumes": [{"name": "log-shipper", "secret": {"secretName": "ops-jobs", "defaultMode": 292,
