  - ambient
  - delayed
  - sidecar
  evidence_chain:
  - redis-cart（network）：cartservice 的 CPU、限流正常；购物车操作的耗时和它要发给 Redis 的命令条数成正比，加购（两条命令）比看购物车（一条）多一倍；调用 redis-cart 的请求每次多出 213 到 397 毫秒左右，不随并发增长；redis-cart 的 CPU、限流、重启都正常，没有报错；redis-cart 的探针一直正常
  - 排除 cartservice 的改动（RELEASE_TAG）：只是滚动发布了同一个版本（RELEASE_TAG 变了），配置和资源都没变
  - 排除 recommendationservice 的改动（RELEASE_TAG，并新增 sidecar 容器 log-shipper（CPU 上限 20m））：同一次发布给 recommendationservice 加了日志转发的 sidecar 容器 log-shipper，CPU 上限只有 20m。它每隔几秒处理一批日志，每批要二十多毫秒 CPU，在 20m 的配额下要排一秒左右，所以一直被限流；指标表按
