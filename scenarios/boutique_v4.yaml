      why: 只是滚动发布了同一个版本（RELEASE_TAG 变了），配置和资源都没变
    - object: frontend
      change: RELEASE_TAG
      why: 只是滚动发布了同一个版本（RELEASE_TAG 变了），配置和资源都没变
