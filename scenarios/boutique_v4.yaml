      currencyservice:
        sidecar: log-shipper
  ticket_guess: null
  design:
  - release
  - lookalike
  - ambient
  - delayed
  - sidecar
  evidence_chain:
  - checkoutservice（config）：checkoutservice 的日志里调用 paymentservice 的请求报错（对方不认识这个接口）；Deployment checkoutservice 的 PAYMENT_SERVICE_ADDR=emailservice:5000，指向的是 emailservice 的 Service；上一版 ReplicaSet 里是 paymentservice:50051；paymentservice
    自己的日志里没有收到这些请求
  - 排除 checkoutservice 的改动（PRODUCT_CATALOG_SERVICE_ADDR=productcatalogservice.boutique.svc.cluster.local:3550）：PRODUCT_CATALOG_SERVICE_ADDR 从 productcatalogservice:3550 改成了完整域名 productcatalogservice.boutique.svc.cluster.local:3550，指向的是同一个
    Service，调用正常
  - 排除 currencyservice 的改动（RELEASE_TAG，并新增 sidecar 容器 log-shipper（CPU 上限 20m））：同一次发布给 currencyservice 加了日志转发的 sidecar 容器 log-shipper，CPU 上限只有 20m。它每隔几秒处理一批日志，每批要二十多毫秒 CPU，在 20m 的配额下要排一秒左右，所以一直被限流；指标表按 Pod
    合计，currencyservice 这个 Pod 的限流占比明显大于 0，上限一列是两个容器之和。但 CPU 配额按容器算：currencyservice 的业务容器上限 200m，Pod 的用量远低于这个数，业务容器没有被限流；sidecar 不在任何请求的路径上，它自己的日志里每批耗时一秒左右，被拉长的是它自己。所以 currencyservice 处理请求不慢，解释不了用户看到的症状
  - 排除后台服务：promo-feed-sync 一直被限流、日志里有外部接口的报错，uptime-checker 和 catalog-crawler 只是流量来源；它们都不在慢请求或失败请求的路径上，故障前后表现一样
