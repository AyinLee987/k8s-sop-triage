  - 排除 shippingservice 的改动（cpu limit 80m）：CPU 上限从 200m 调到 80m，仍远高于它的平均用量，最多有零星几次限流，解释不了用户看到的症状
  - 排除 productcatalogservice 的改动（RELEASE_TAG，并新增 sidecar 容器 log-shipper（CPU 上限 20m））：同一次发布给 productcatalogservice 加了日志转发的 sidecar 容器 log-shipper，CPU 上限只有 20m。它每隔几秒处理一批日志，每批要二十多毫秒 CPU，在 20m 的配额下要排一秒左右，所以一直被限流；指标表按
    Pod 合计，productcatalogservice 这个 Pod 的限流占比明显大于 0，上限一列是两个容器之和。但 CPU 配额按容器算：productcatalogservice 的业务容器上限 200m，Pod 的用量远低于这个数，业务容器没有被限流；sidecar 不在任何请求的路径上，它自己的日志里每批耗时一秒左右，被拉长的是它自己。所以 productcatalogservice
