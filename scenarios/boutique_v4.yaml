  answer:
    status: root_cause_found
    cause_category: other
    object:
      kind: Deployment
      name: cartservice
    mechanism: cpu
    type: cpu
    explanation: Deployment cartservice 的 CPU 上限在这次发布里被改成 30m（原来 300m），容器被限流，请求要排队等 CPU；网络没有问题。
    key_evidence:
    - 30m
    decidable: true
    decidable_why: 指标表里它的限流周期占比明显大于 0，Deployment 里能看到上限；被限流的服务和变慢的页面对得上。productcatalogservice 的 Pod 虽然也被限流，但用量远低于它业务容器的上限，被限流的是新加的 sidecar；真正被限流的业务容器，平均用量占它自己上限的比例要高得多（实测四到五成），sidecar 所在 Pod 的用量只有 Pod 上限的几个百分点。
    evidence:
    - Deployment cartservice 的 CPU 上限是 30m，上一版 ReplicaSet 里是 300m
    - 指标表：cartservice 被限流的周期占比明显大于 0，平均 CPU 用量约为上限的四到五成（不一定顶到上限：请求成批到来时会把每 100ms 的配额用完）；另外被限流的还有 productcatalogservice 的 Pod（来自同一次发布新加的 log-shipper 容器，这个 Pod 的用量远低于业务容器的上限）和后台的 promo-feed-sync
    - 调用 cartservice 次数多的页面慢得多，不调用它的请求不慢
    also:
    - object:
        kind: Pod
        name: currencyservice
      accept_objects:
      - currencyservice
      mechanism: network
      type: net_loss
      explanation: currencyservice 的 Pod 网络有约 6% 的丢包；被丢的包要等重传，所以只有一部分请求变慢，它自身处理不慢。
      key_evidence:
      - currencyservice
      decidable: true
      decidable_why: 连接请求的包丢了要等 1 秒才重发，所以它的探针（超时 1 秒）会间歇报连接超时；进程在处理前卡住不会让连接建不起来；限流为 0 排除了 CPU。
      evidence:
      - 变慢的只是一部分请求，慢的那些多出来的时间成一个个台阶（重传等待），不是平均地都慢一点
      - 慢的请求都经过 currencyservice；currencyservice 的 CPU、限流、重启都正常
      - currencyservice 的就绪/存活探针间歇报连接超时（failed to connect … within 1s 或 dial tcp … i/o timeout），它的 CPU 空闲、不被限流
    harmless_changes:
    - object: frontend
      change: CURRENCY_SERVICE_ADDR=currencyservice.boutique.svc.cluster.local:7000
      why: CURRENCY_SERVICE_ADDR 从 currencyservice:7000 改成了完整域名 currencyservice.boutique.svc.cluster.local:7000，指向的是同一个 Service，调用正常
    - object: shippingservice
      change: cpu limit 80m
      why: CPU 上限从 200m 调到 80m，仍远高于它的平均用量，最多有零星几次限流，解释不了用户看到的症状
    - object: productcatalogservice
      change: RELEASE_TAG，并新增 sidecar 容器 log-shipper（CPU 上限 20m）
      why: 同一次发布给 productcatalogservice 加了日志转发的 sidecar 容器 log-shipper，CPU 上限只有 20m。它每隔几秒处理一批日志，每批要二十多毫秒 CPU，在 20m 的配额下要排一秒左右，所以一直被限流；指标表按 Pod 合计，productcatalogservice 这个 Pod 的限流占比明显大于 0，上限一列是两个容器之和。但 CPU
        配额按容器算：productcatalogservice 的业务容器上限 200m，Pod 的用量远低于这个数，业务容器没有被限流；sidecar 不在任何请求的路径上，它自己的日志里每批耗时一秒左右，被拉长的是它自己。所以 productcatalogservice 处理请求不慢，解释不了用户看到的症状
    not_cause:
    - name: frontend
      why: CURRENCY_SERVICE_ADDR 从 currencyservice:7000 改成了完整域名 currencyservice.boutique.svc.cluster.local:7000，指向的是同一个 Service，调用正常
    - name: shippingservice
      why: CPU 上限从 200m 调到 80m，仍远高于它的平均用量，最多有零星几次限流，解释不了用户看到的症状
    - name: productcatalogservice
      why: 同一次发布给 productcatalogservice 加了日志转发的 sidecar 容器 log-shipper，CPU 上限只有 20m。它每隔几秒处理一批日志，每批要二十多毫秒 CPU，在 20m 的配额下要排一秒左右，所以一直被限流；指标表按 Pod 合计，productcatalogservice 这个 Pod 的限流占比明显大于 0，上限一列是两个容器之和。但 CPU
        配额按容器算：productcatalogservice 的业务容器上限 200m，Pod 的用量远低于这个数，业务容器没有被限流；sidecar 不在任何请求的路径上，它自己的日志里每批耗时一秒左右，被拉长的是它自己。所以 productcatalogservice 处理请求不慢，解释不了用户看到的症状
