    pattern: cartservice 的 CPU 上限过低，只有这一个故障。同一批里还有一个看着可疑的地址改写和一个调低但够用的 CPU 上限。和 ET16 成对。
    sources:
    - Cloud-OpsBench
    - k8s.af
    - K8s排障Agent测试平台_故障难度提升方案
    validated: false
    validate_note: 确认每个故障都生效；无害成员的服务不变慢、不被限流（看验证记录里的限流表）；延迟和丢包场景确认被注入的 Pod 仍是 Ready、重启次数为 0。第四版：确认后台服务都在运行、promo-feed-sync 被限流；标成可分清的延迟（285 毫秒）要在观察期里出现探针超时，但不能让 Pod 重启；标成分不清的不能出现探针超时。第四版加难（sidecar）：productcatalogservice
