        cpu: 80m
      productcatalogservice:
        sidecar: log-shipper
  ticket_guess: null
  design:
  - release
  - lookalike
  - paired
  - ambient
  - delayed
  - sidecar
  evidence_chain:
  - cartservice（cpu）：Deployment cartservice 的 CPU 上限是 30m，上一版 ReplicaSet 里是 300m；指标表：cartservice 被限流的周期占比明显大于 0，平均 CPU 用量约为上限的四到五成（不一定顶到上限：请求成批到来时会把每 100ms 的配额用完）；另外被限流的还有 productcatalogservice 的 Pod（来自同一次发布新加的
    log-shipper 容器，这个 Pod 的用量远低于业务容器的上限）和后台的 promo-feed-sync；调用 cartservice 次数多的页面慢得多，不调用它的请求不慢
