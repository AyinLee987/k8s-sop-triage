  - kubectl:
    - apply
    - -f
    - '{repo}/scenarios/netem/injector-boutique-hard-BT01.yaml'
  - kubectl:
    - -n
    - infra-tools
    - wait
    - --for=condition=Ready
    - pod/net-injector
