- id: R15
  split: holdout
  kind: cross_component
  realism:
    pattern: 给单线程的 Redis 设了很低的 CPU limit，CFS 限流把每次请求拖慢到客户端超时；平均 CPU 使用率看起来并不高。
    sources:
    - 'kubernetes/kubernetes#67577「CFS quotas can lead to unnecessary throttling」: https://github.com/kubernetes/kubernetes/issues/67577'
    - 'Buffer：去掉 CPU limit 后延迟大幅下降: https://erickhun.com/posts/kubernetes-faster-services-no-cpu-limits/'
    - 'k8s.af CPU 限流类（Airbnb、Buffer、Omio、Zalando 等十余篇）: https://k8s.af/'
    - SREGym cfs_cpu_throttling_*
    validated: true
    validation: k3s 实测（2026-11-10）：100m 时 Redis 正常 Ready，8 并发 300 次提交全部成功；20m 时 Redis 连启动探针都超时，永远到不了 Ready（信号太明显）；50m 时 Redis 就绪状态反复切换（启动探针 2s 超时），43% 的提交返回 503，api 日志里 TimeoutError 和 ConnectionError 混在一起。选
      50m。注意：Pod 坏掉后 StatefulSet 不会自动换成新规格，复位必须删掉 redis-0。
  symptom: 提交接口时不时返回 503，api 的 Pod 偶尔变成不 Ready 又自己恢复；Redis 的 Pod 一直是 Running。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - statefulset/redis
    - -c
    - redis
    - --limits=cpu=50m
    - --requests=cpu=50m
  - kubectl:
    - -n
    - '{ns}'
    - wait
    - --for=jsonpath={.spec.containers[0].resources.limits.cpu}=50m
    - pod/redis-0
    - --timeout=120s
  - kubectl:
    - -n
    - '{ns}'
    - exec
    - deployment/api
    - -c
    - api
    - --
    - python
    - -c
    - "import json,uuid,urllib.request as u\nfor i in range(40):\n    r=u.Request('http://127.0.0.1:8000/events',data=json.dumps({'event_id':str(uuid.uuid4()),'user_id':'probe','event_type':'click'}).encode(),headers={'Content-Type':'application/json'})\n\
      \    try: print(u.urlopen(r,timeout=3).status)\n    except Exception as e: print(getattr(e,'code',type(e).__name__))\n"
  confirm:
    timeout_s: 120
    checks:
    - type: logs_contain
      selector: app=api
      text: TimeoutError
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - statefulset/redis
    - -c
    - redis
    - --limits=cpu=1
    - --requests=cpu=100m
  - kubectl:
    - -n
    - '{ns}'
    - delete
    - pod
    - redis-0
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - statefulset/redis
    - --timeout=150s
  answer:
    status: root_cause_found
    object:
      kind: StatefulSet
      name: redis
    accept_objects:
    - redis
    symptom_objects:
    - api
    cause_category: cpu_limit_too_low
    explanation: StatefulSet redis 的 CPU limit 被改成 50m，单线程的 Redis 被 CFS 限流，请求处理变慢，客户端在 1 秒超时内拿不到结果（TimeoutError），api 返回 503、就绪探针间歇失败。
    key_evidence:
    - 50m
    - TimeoutError
    - limits
    - Startup probe failed
    accept_cause_keywords:
    - CPU
    - 限流
    - throttl
    - 50m
    - limit
