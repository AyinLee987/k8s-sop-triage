    - 'Palark Redis 数据丢失事故: https://palark.com/blog/failure-with-redis-operator-and-redis-data-analysis-tools.md'
    validated: true
    validation: k3s 实测（2026-11-10）：注入前事件可查（200，累计 733 条）；挂错路径后 Redis 重启，同一事件返回 404、统计归零；worker 只在 Redis 重启的几秒里打出 ConnectionError，随后自动重建消费组，没有持续的 NOGROUP 报错；复位后数据从持久卷恢复。
  symptom: Redis 刚做完一次维护重启。重启后用户的点击数全部归零，之前提交过的事件也查不到了（接口返回 404），但所有 Pod 都是正常的。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - exec
    - deployment/api
    - -c
    - api
    - --
