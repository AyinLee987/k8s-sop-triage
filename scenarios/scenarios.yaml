- id: R09
  split: dev
  kind: cross_component
  realism:
    pattern: Secret 里的键被重命名（整理命名、换 chart 版本），引用旧键名的卷挂载失败；Redis 下次重启时卡在 ContainerCreating，所有客户端随之失败。
    sources:
    - SREGym missing_configmap_* / missing_env_variable_*（同类：引用的配置项不存在）
    - 'docker-library/redis#58（认证配置缺失导致客户端被拒）: https://github.com/docker-library/redis/issues/58'
    validated: true
    validation: 'k3s 实测（2026-11-10）：最初的注入命令有 bug（JSON Patch 的 move 把 path 写成了 to，被 API server 拒绝），修正后生效：redis-0 停在 ContainerCreating，事件为 ''MountVolume.SetUp failed for volume "auth" : references non-existent
      secret key: redis-auth.conf''。注意新版本的事件文本里没有 Secret 名字，要从卷定义里查。'
  symptom: Redis 例行重启之后就没再起来，api 全部不 Ready，worker 也停止处理了。
