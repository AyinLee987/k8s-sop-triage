  symptom: 提交事件的接口变慢了，偶尔还会超时；Pod 看起来都是正常的。
  realism:
    pattern: '新版本代码在请求路径里等待下游处理完成（Cloud-OpsBench: code_artificial_delay）。'
    sources:
    - Cloud-OpsBench Application Code Defect
    validated: false
    validate_note: 确认 api 请求日志的 elapsed_ms 普遍超过 600 毫秒，且所有 Pod 都是 Running/Ready。
  inject:
  - &id001
    kubectl:
    - -n
    - '{ns}'
    - set
    - image
    - deployment/api
    - api=tiktok-k8s-lab:v3
  - &id002
    kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/api
    - --timeout=150s
  - kubectl:
    - -n
    - '{ns}'
    - set
    - image
    - deployment/api
    - api=tiktok-k8s-lab:v3.1
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/api
    - --timeout=150s
  - &id003
    kubectl:
    - -n
    - '{ns}'
    - exec
    - deployment/worker
    - -c
    - worker
    - --
    - python
    - -c
    - "import json,uuid,threading,urllib.request as u\ndef run():\n    for i in range(10):\n        r=u.Request('http://api/events',data=json.dumps({'event_id':str(uuid.uuid4()),'user_id':'u%d'%(i%7),'event_type':'click'}).encode(),headers={'Content-Type':'application/json'})\n        try: u.urlopen(r,timeout=5).read()\n        except Exception: pass\nts=[threading.Thread(target=run) for _ in range(20)]\n[t.start() for t in ts]; [t.join() for t in ts]; print('load done')\n"
  confirm:
    timeout_s: 60
    checks:
    - type: slow_requests
      min_ms: 600
      count: 10
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - image
    - deployment/api
    - api=tiktok-k8s-lab:v1
  answer:
    status: root_cause_found
    object:
      kind: Deployment
      name: api
    cause_category: other
    explanation: api 的新镜像 v3.1 在提交接口里等待事件被 worker 处理完才返回（最多 1.5 秒），所以每次提交都要等 worker；Pod、Redis、worker 本身都正常。
    key_evidence:
    - v3.1
    accept_cause_keywords:
    - v3.1
    - 代码
    - code
    - 镜像
    - image
    - 版本
