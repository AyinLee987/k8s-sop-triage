- id: L03
  split: dev
  kind: latent_slow
  # 与 holdout 的 R15 同属 CPU limit 过低，但表现不同（R15 是探针失败，这里是变慢）。L 组不用于编写 SOP/经验。
  mechanism: cpu_throttle_latency
  symptom: 提交事件的接口变慢了，偶尔还会超时；Pod 看起来都是正常的。
  realism:
    pattern: 'CPU limit 过低被限流（Cloud-OpsBench: pod_cpu_overload）。'
    sources:
    - Cloud-OpsBench Performance
    - k8s.af CPU throttling
    validated: false
    validate_note: 确认 api 请求日志的 elapsed_ms 中位数在 200 毫秒以上（正常是几毫秒），且 Pod 没有重启、没有变成 NotReady。
  inject:
  - *id001
  - *id002
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/api
    - -c
    - api
    - --limits=cpu=60m
    - --requests=cpu=60m
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/api
    - --timeout=200s
  - *id003
  confirm:
    timeout_s: 60
    checks:
    - type: slow_requests
      min_ms: 200
      count: 60
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/api
    - -c
    - api
    - --limits=cpu=500m,memory=192Mi
    - --requests=cpu=100m,memory=96Mi
  - kubectl:
    - -n
    - '{ns}'
    - set
    - image
    - deployment/api
    - api=tiktok-k8s-lab:v1
  answer:
    status: root_cause_found
    object:
      kind: Deployment
      name: api
    cause_category: other
    explanation: api 的 CPU limit 被改成 60m，请求处理被 CFS 限流而变慢；镜像和代码没有问题。
    key_evidence:
    - 60m
    accept_cause_keywords:
    - cpu
    - 限流
    - throttl
    - 60m
