- id: R13
  split: holdout
  kind: cross_component
  realism:
    pattern: 存活探针调用了检查依赖的接口：依赖短暂不可用（例行重启）时，kubelet 把所有 api Pod 都判定为死掉并重启，触发事件在 Redis，根因在 api 的探针设计。
    sources:
    - 'srcco.de「Kubernetes Liveness Probes are Dangerous」: https://srcco.de/posts/kubernetes-liveness-probes-are-dangerous.html'
    - 'Microsoft AKS 关键任务博客（2025 年两次真实事故）: https://techcommunity.microsoft.com/t5/microsoft-mission-critical-blog/hardening-spring-boot-health-probes-on-aks-how-to-prevent/ba-p/4491549'
    - 'k8s.af livenessProbe 类（NRE Labs、ThredUP）: https://k8s.af/'
    - SREGym liveness_probe_too_aggressive_*
    validated: true
    validation: k3s 实测（2026-11-10）：Redis 例行重启期间 api 出现 "Liveness probe failed" 并被重启，与设计一致。
  symptom: Redis 刚做完一次例行重启，之后 api 的 Pod 全部重启了，重启次数还在涨。
  precheck:
  - type: jsonpath_equals
    resource: deployment/api
    path: '{.spec.template.spec.containers[0].livenessProbe.httpGet.path}'
    value: /health/live
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - deployment/api
    - --type=json
    - -p
    - '[{"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/httpGet/path", "value": "/health/ready"}, {"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/failureThreshold",
      "value": 1}]'
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/api
    - --timeout=150s
  - kubectl:
    - -n
    - '{ns}'
    - delete
    - pod
    - redis-0
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - statefulset/redis
    - --timeout=150s
  confirm:
    timeout_s: 90
    checks:
    - type: pod_restart_count_at_least
      selector: app=api
      count: 1
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - deployment/api
    - --type=json
    - -p
    - '[{"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/httpGet/path", "value": "/health/live"}, {"op": "replace", "path": "/spec/template/spec/containers/0/livenessProbe/failureThreshold",
      "value": 3}]'
  answer:
