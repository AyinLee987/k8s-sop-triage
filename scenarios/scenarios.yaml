  - kubectl:
    - -n
    - '{ns}'
    - delete
    - pod
    - redis-0
    - --wait=true
    - --timeout=90s
  confirm:
    timeout_s: 60
    checks:
    - type: pod_waiting_reason
      selector: app=redis
      reasons:
      - ContainerCreating
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - secret/redis-auth
    - --type=json
    - -p
    - '[{"op": "move", "from": "/data/auth.conf", "path": "/data/redis-auth.conf"}]'
  - kubectl:
    - -n
    - '{ns}'
    - delete
    - pod
    - redis-0
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - statefulset/redis
    - --timeout=150s
  answer:
    status: root_cause_found
    object:
      kind: Secret
      name: redis-auth
    accept_objects:
    - redis-auth
    - redis
    symptom_objects:
    - api
