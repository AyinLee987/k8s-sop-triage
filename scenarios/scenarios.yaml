# 场景规格 v2。只有执行器（triage.lifecycle）和评分器（triage.grader）读取这个文件。
# 诊断器只能拿到 symptom 字符串和只读工具，看不到这里的 id、注入方式、答案和 realism。
#
# v2 的每个场景都来自真实事故或公开基准的故障库，出处写在 realism.sources 里；
# 完整的选型过程、被排除的候选和原因见 scenarios/CATALOG.md。v1 的手写场景归档在 scenarios/archive/。
#
# realism.validated=false 表示注入在真集群上的表现还没有实测（smoke 检查点会验证）；
# 没生效会记为环境失败，不会算诊断错。
#
# 划分按故障机制（cause_category）：同一种机制只出现在一个集合里。
#   dev（开发集，也是回归集；bad case 经验只从这里来）：R01–R09
#   holdout（保留测试集，定稿前不看结果、不调参）：R10–R16
#   其中 R14（数据卷挂错路径）是故意保留的 SOP 盲区：SOP 只在基线里写了挂载路径，没有写排查步骤，
#   用来测"SOP 没写到的问题"。R16 是权限边界。
# 同症状不同原因的配对跨越两个集合，例如"事件一直 queued"：R02（dev）/ R10、R11（holdout）。
#
# 模板变量：{ns} 业务命名空间；{lab_k8s} tiktok-k8s-lab/k8s 目录；{lab} tiktok-k8s-lab 根目录；{repo} 本仓库根目录。

baseline: 命名空间 {ns} 内 Deployment api 2/2、worker 1/1 可用，StatefulSet redis 1/1 就绪，所有 Pod Ready 且没有等待原因；ConfigMap app-config、redis-config 和 Service redis 与基线一致；不存在命名空间 rec-feature。

scenarios:
- id: R01
  split: dev
  kind: cross_component
  realism:
    pattern: Redis 数据只增不减（事件 hash 没有 TTL、数据流没有 MAXLEN），长期累积到 maxmemory；noeviction 下写入被拒，读和 PING 仍正常，所以所有 Pod 都显示 Ready。
    sources:
    - https://redis.io/docs/latest/develop/reference/errors/common/oom/
    - 'SREGym valkey_memory_disruption: https://raw.githubusercontent.com/SREGym/SREGym/main/sregym/conductor/problems/registry.py'
    - 'ITBench CacheFailure（论文 Table 12）: https://arxiv.org/html/2502.05352'
    app_fact: app/store.py 的 SUBMIT 脚本 XADD 不带 MAXLEN，事件 hash 不设过期；两个就绪探针都只发 PING。
    validated: true
    validation: k3s 实测（2026-11-10）：写满后 api 日志 error_type=OutOfMemoryError（5/5），所有 Pod 保持 Ready，与设计一致。
  symptom: 用户反馈提交点击大量失败，接口返回 503；可是 kubectl 看所有 Pod 都是 Running、Ready，最近也没有发布。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - exec
    - redis-0
    - -c
    - redis
    - --
    - sh
    - -c
    - i=0; while [ $i -lt 80 ]; do out=$(redis-cli --no-auth-warning EVAL "for j=1,20000 do local k=ARGV[1]..'-'..ARGV[2]..'-'..j redis.call('HSET',k,'event_id',k,'user_id','u'..(j%5000),'event_type','click','status','completed','received_at','2026-08-01T00:00:00+00:00','completed_at','2026-08-01T00:00:01+00:00','stream_id','0-0')
      end return 1" 0 tiktok-lab:event:backfill $i 2>&1); case "$out" in *OOM*) break;; esac; i=$((i+1)); done; echo batches=$i
  - kubectl:
    - -n
    - '{ns}'
    - exec
    - deployment/api
    - -c
    - api
    - --
    - python
    - -c
    - "import json,uuid,urllib.request as u\nfor i in range(5):\n    r=u.Request('http://127.0.0.1:8000/events',data=json.dumps({'event_id':str(uuid.uuid4()),'user_id':'probe','event_type':'click'}).encode(),headers={'Content-Type':'application/json'})\n\
      \    try: print(u.urlopen(r,timeout=3).status)\n    except Exception as e: print(getattr(e,'code',type(e).__name__))\n"
  confirm:
    timeout_s: 60
    checks:
    - type: logs_contain
      selector: app=api
      text: redis_unavailable
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - exec
    - redis-0
    - -c
    - redis
    - --
    - sh
    - -c
    - redis-cli --no-auth-warning --scan --count 1000 --pattern 'tiktok-lab:event:backfill-*' | xargs -r -n 500 redis-cli --no-auth-warning DEL > /dev/null; echo cleaned
  answer:
    status: root_cause_found
    object:
      kind: StatefulSet
      name: redis
    accept_objects:
    - redis
    symptom_objects:
    - api
    cause_category: dependency_memory_full
    explanation: Redis 已用内存涨到 maxmemory（配置没变，仍是 192mb），noeviction 策略下写入被拒（OOM command not allowed）；api 写入失败返回 503。读命令和 PING 不受影响，所以就绪探针全部通过。现象在 api，根因在 Redis 的数据增长。
    key_evidence:
    - OutOfMemoryError
    - OOM
    - maxmemory
    accept_cause_keywords:
    - 内存
    - memory
    - maxmemory
    - OOM
    - 写满
- id: R02
  split: dev
  kind: same_symptom_diff_cause
  realism:
    pattern: 运维操作把消费者缩到 0（误操作、缩容脚本、节省成本），生产者一切正常，积压静默增长。
    sources:
    - 'AIOpsLab scale_pod_zero_social_net（inject_virtual.py）: https://raw.githubusercontent.com/microsoft/AIOpsLab/main/aiopslab/orchestrator/problems/registry.py'
    validated: true
    validation: k3s smoke（2026-11-10）：3 轮注入、确认、复位全部成功。
  symptom: 接口能正常提交事件，但事件一直停在 queued 状态，用户点击数不增长。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - scale
    - deployment/worker
    - --replicas=0
  - kubectl:
    - -n
    - '{ns}'
    - wait
    - --for=delete
    - pod
    - -l
    - app=worker
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - exec
    - deployment/api
    - -c
    - api
    - --
    - python
    - -c
    - "import json,uuid,urllib.request as u\nfor i in range(5):\n    r=u.Request('http://127.0.0.1:8000/events',data=json.dumps({'event_id':str(uuid.uuid4()),'user_id':'probe','event_type':'click'}).encode(),headers={'Content-Type':'application/json'})\n\
      \    try: print(u.urlopen(r,timeout=3).status)\n    except Exception as e: print(getattr(e,'code',type(e).__name__))\n"
  confirm:
    timeout_s: 30
    checks:
    - type: jsonpath_equals
      resource: deployment/worker
      path: '{.spec.replicas}'
      value: '0'
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - scale
    - deployment/worker
    - --replicas=1
  answer:
    status: root_cause_found
    object:
      kind: Deployment
      name: worker
    cause_category: scaled_to_zero
    explanation: Deployment worker 的副本数被缩成 0，没有消费者处理事件；api 正常写入，事件全部停在 queued。
    key_evidence:
    - desired=0
    - 'desired: 0'
    - replicas=0
    - 0/0
    - 副本数为 0
    - 副本数是 0
    accept_cause_keywords:
    - 副本
    - replica
    - 缩
    - scale
    - '0'
- id: R03
  split: dev
  kind: cross_component
  realism:
    pattern: 有人在 Redis 上用 CONFIG SET 运行时改了密码（排障时手动改、脚本误操作），配置文件和 Secret 都没变。已经建立的连接不受影响，新连接全部认证失败，所以故障在客户端重启后才暴露。
    sources:
    - 'SREGym valkey_auth_disruption（论文提到 agent 常误判为内存问题）: https://raw.githubusercontent.com/SREGym/SREGym/main/sregym/conductor/problems/registry.py'
    - 'AIOpsLab revoke_auth_mongodb: https://raw.githubusercontent.com/microsoft/AIOpsLab/main/aiopslab/orchestrator/problems/revoke_auth/revoke_auth.py'
    - 'ITBench IncorrectAuthentication（论文 Table 12）: https://arxiv.org/html/2502.05352'
    validated: true
    validation: 'k3s 实测（2026-11-10）：Redis 自己的就绪探针事件带 "AUTH failed: WRONGPASS"，重启后的 worker 日志为 AuthenticationError，Redis 显示不 Ready，与设计一致。'
  symptom: worker 刚做了一次例行重启，重启后就一直处理不了事件；Redis 的 Pod 好像也变成了不 Ready。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - exec
    - redis-0
    - -c
    - redis
    - --
    - sh
    - -c
    - redis-cli --no-auth-warning CONFIG SET requirepass "manual-$(date +%s)" > /dev/null && echo changed
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - restart
    - deployment/worker
  confirm:
    timeout_s: 60
    checks:
    - type: pod_not_ready
      selector: app=redis
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - delete
    - pod
    - redis-0
    - --wait=true
    - --timeout=90s
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - statefulset/redis
    - --timeout=150s
  answer:
    status: root_cause_found
    object:
      kind: StatefulSet
      name: redis
    accept_objects:
    - redis
    symptom_objects:
    - worker
    - api
    cause_category: dependency_config_error
    explanation: Redis 的密码在运行时被 CONFIG SET 改掉了：redis-config 和 Secret 都和基线一致，但 Redis 自己的就绪探针认证失败，重启后的 worker 也认证失败。根因在 Redis 一侧的运行时配置。
    key_evidence:
    - WRONGPASS
    - AUTH failed
    - NOAUTH
    - Readiness probe failed
    - AuthenticationError
    accept_cause_keywords:
    - CONFIG SET
    - 运行时
    - runtime
    - requirepass
    - 手动
    - 密码
- id: R04
  split: dev
  kind: cross_component
  realism:
    pattern: Service 的 targetPort 和容器端口对不上：Pod 全部 Running/Ready，endpoints 也有，但连接被拒。
    sources:
    - 'AIOpsLab k8s_target_port-misconfig（targetPort 9090→9999）: https://raw.githubusercontent.com/microsoft/AIOpsLab/main/aiopslab/orchestrator/problems/k8s_target_port_misconfig/target_port.py'
    validated: true
    validation: k3s 实测（2026-11-10）：只改 targetPort 时什么都不坏，api 保持 Ready、worker 照常处理事件，因为连接池里已建立的连接不受 Service 变更影响。加上一次例行重启（客户端被迫新建连接）后才暴露，因此注入里加了重启，症状也改为"例行重启后"。
  symptom: api 和 worker 刚做完一次例行重启，之后 api 全部不 Ready、提交不了事件，worker 也一直在重试；可是 Redis 的 Pod 是 Running、Ready 的。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - service/redis
    - --type=json
    - -p
    - '[{"op": "replace", "path": "/spec/ports/0/targetPort", "value": 6380}]'
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - restart
    - deployment/api
    - deployment/worker
  confirm:
    timeout_s: 60
    checks:
    - type: pod_not_ready
      selector: app=api
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - service/redis
    - --type=json
    - -p
    - '[{"op": "replace", "path": "/spec/ports/0/targetPort", "value": "redis"}]'
  answer:
    status: root_cause_found
    object:
      kind: Service
      name: redis
    symptom_objects:
    - api
    - worker
    cause_category: service_misconfigured
    explanation: Service redis 的 targetPort 被改成 6380，而 Redis 容器监听 6379。已建立的长连接不受影响，所以改完当时没有任何异常；例行重启后客户端要新建连接，经 Service 连不上 Redis。Redis 本身健康，重启只是触发点，根因在 Service。
    key_evidence:
    - targetPort
    - '6380'
    accept_cause_keywords:
    - targetPort
    - 端口
    - port
    - '6380'
    - Service
- id: R05
  split: dev
  kind: same_symptom_diff_cause
  realism:
    pattern: 内存 limit 被调到低于进程实际占用，容器反复 OOMKilled。
    sources:
    - 'ITBench MemoryResourceLimit（论文 Table 12）: https://arxiv.org/html/2502.05352'
    - 'SREGym resource_request_too_small: https://raw.githubusercontent.com/SREGym/SREGym/main/sregym/conductor/problems/registry.py'
    - 'k8s.af OOM 类事故（Blue Matador、NU.nl、Nordstrom、Zalando）: https://k8s.af/'
    validated: true
    validation: k3s 实测（2026-11-10）：worker 常驻内存约 19–20 MiB；24Mi 不会触发 OOM，16Mi 时新 Pod 启动即 OOMKilled、CrashLoopBackOff。滚动发布时旧 Pod 不会被替换，事件照常处理，所以真实症状是"发布卡住"，不是"事件积压"，症状描述已按实测修改。
  symptom: worker 刚发布了新版本，新 Pod 一直在重启，发布卡住了。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/worker
    - -c
    - worker
    - --limits=memory=16Mi
    - --requests=memory=16Mi
  confirm:
    timeout_s: 120
    checks:
    - type: pod_last_terminated_reason
      selector: app=worker
      reason: OOMKilled
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - resources
    - deployment/worker
    - -c
    - worker
    - --limits=cpu=500m,memory=128Mi
    - --requests=cpu=100m,memory=64Mi
  answer:
    status: root_cause_found
    object:
      kind: Deployment
      name: worker
    cause_category: memory_limit_too_low
    explanation: worker 的内存 limit 被改成 16Mi，低于进程常驻内存（约 19–20 MiB），新 Pod 一启动就被 OOMKilled；滚动发布卡住，旧 Pod 还在继续处理事件。
    key_evidence:
    - OOMKilled
    - 16Mi
    accept_cause_keywords:
    - 内存
    - memory
    - OOM
    - 16Mi
    - limit
- id: R06
  split: dev
  kind: single_evidence
  realism:
    pattern: 发布引用了节点上不存在的镜像标签（CI 打了标签但没推送 / 没导入），新 Pod 拉不到镜像，滚动发布卡住，老 Pod 继续服务。
    sources:
    - 'ITBench CorruptImage / Nonexistent Kubernetes Workload Container Image: https://arxiv.org/html/2502.05352'
    - 'AIOpsLab misconfig_app_hotel_res（换镜像）: https://raw.githubusercontent.com/microsoft/AIOpsLab/main/aiopslab/orchestrator/problems/misconfig_app/misconfig_app_hotel_res.py'
    - SREGym incorrect_image
    validated: true
    validation: k3s smoke（2026-11-10）：3 轮全部成功，新 Pod 停在 ErrImageNeverPull。
  symptom: 刚发布了 api 的新版本，发布一直卡着没完成，新 Pod 起不来。
  inject:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - image
    - deployment/api
    - api=tiktok-k8s-lab:v1.1
  confirm:
    timeout_s: 90
    checks:
    - type: pod_waiting_reason
      selector: app=api
      reasons:
      - ErrImageNeverPull
      - ErrImagePull
      - ImagePullBackOff
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - set
    - image
    - deployment/api
    - api=tiktok-k8s-lab:v1
  answer:
    status: root_cause_found
    object:
      kind: Deployment
      name: api
    cause_category: image_unavailable
    explanation: '镜像标签 v1.1 在节点上不存在（imagePullPolicy: Never），新 Pod 停在 ErrImageNeverPull。'
    key_evidence:
    - v1.1
    - ErrImageNeverPull
    - ImagePullBackOff
    - ErrImagePull
    accept_cause_keywords:
    - 镜像
    - image
    - v1.1
