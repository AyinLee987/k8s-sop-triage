    - -c
    - "import json,uuid,urllib.request as u\nfor i in range(5):\n    r=u.Request('http://127.0.0.1:8000/events',data=json.dumps({'event_id':str(uuid.uuid4()),'user_id':'probe','event_type':'click'}).encode(),headers={'Content-Type':'application/json'})\n\
      \    try: print(u.urlopen(r,timeout=3).status)\n    except Exception as e: print(getattr(e,'code',type(e).__name__))\n"
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - statefulset/redis
    - --type=json
    - -p
    - '[{"op": "replace", "path": "/spec/template/spec/containers/0/volumeMounts/0/mountPath", "value": "/var/lib/redis"}]'
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - statefulset/redis
    - --timeout=150s
  confirm:
    timeout_s: 30
    checks:
    - type: jsonpath_equals
      resource: statefulset/redis
      path: '{.spec.template.spec.containers[0].volumeMounts[0].mountPath}'
      value: /var/lib/redis
  reset:
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - statefulset/redis
    - --type=json
    - -p
    - '[{"op": "replace", "path": "/spec/template/spec/containers/0/volumeMounts/0/mountPath", "value": "/data"}]'
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - statefulset/redis
    - --timeout=150s
  answer:
    status: root_cause_found
    object:
      kind: StatefulSet
      name: redis
    accept_objects:
    - redis
    symptom_objects:
    - api
    - worker
    cause_category: other
