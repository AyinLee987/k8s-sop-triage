  inject:
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - deployment
    - currencyservice
    - --type=strategic
    - -p
    - '{"spec": {"template": {"spec": {"containers": [{"name": "server", "env": [{"name": "RELEASE_TAG", "value": "2026.11.24-1"}], "resources": {"limits": {"cpu": "25m"}, "requests": {"cpu": "25m"}}}]}}}}'
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/currencyservice
    - --timeout=140s
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - deployment
    - shippingservice
    - --type=strategic
    - -p
    - '{"spec": {"template": {"spec": {"containers": [{"name": "server", "env": [{"name": "RELEASE_TAG", "value": "2026.11.24-1"}], "resources": {"limits": {"cpu": "80m"}, "requests": {"cpu": "80m"}}}]}}}}'
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/shippingservice
    - --timeout=140s
  - kubectl:
    - -n
    - '{ns}'
    - patch
    - deployment
    - adservice
    - --type=strategic
    - -p
    - '{"spec": {"template": {"spec": {"containers": [{"name": "server", "env": [{"name": "RELEASE_TAG", "value": "2026.11.24-1"}]}]}}}}'
  - kubectl:
    - -n
    - '{ns}'
    - rollout
    - status
    - deployment/adservice
    - --timeout=140s
  - sleep: 25
  confirm:
    timeout_s: 180
    checks:
    - &id001
      type: slow_requests
      selector: app=frontend
