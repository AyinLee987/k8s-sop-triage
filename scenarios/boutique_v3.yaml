  - currencyservice（cpu）：Deployment currencyservice 的 CPU 上限是 25m，上一版 ReplicaSet 里是 200m；指标表：currencyservice 的 CPU 用量顶在上限附近，被限流的周期占比明显大于 0；别的服务不被限流或只有零星几次；调用 currencyservice 次数多的页面慢得多，不调用它的请求不慢
  - 排除 shippingservice 的改动（cpu limit 80m）：CPU 上限从 200m 调到 80m，仍远高于它的平均用量，最多有零星几次限流，解释不了用户看到的症状
