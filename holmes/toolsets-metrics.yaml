# Custom HolmesGPT toolset: container metrics for the Online Boutique namespace (holmes ask ... --custom-toolsets <this file>).
# One tool, no arguments: nothing the model writes reaches a shell. The command reads the kubelet's cAdvisor endpoint with a
# token that may only read node metrics (k8s/rbac-metrics.yaml) and prints one table for the pods of `boutique`.
toolsets:
  boutique/metrics:
    enabled: true
    description: "Container resource metrics (CPU usage, CPU throttling, memory, pod network counters) for the pods in the boutique namespace, read from the node's kubelet (cAdvisor)."
    tools:
      - name: boutique_pod_metrics
        description: "Returns one table for every pod in the boutique namespace: CPU usage against its limit, the share of CFS periods in which the container was throttled (last ~15 seconds and since the container started), how long the pod has been running, memory against its limit, and the pod network interface's packet, drop and error counters. Takes 15 to 30 seconds. No arguments."
        command: "python /work/scripts/pod_metrics.py"
