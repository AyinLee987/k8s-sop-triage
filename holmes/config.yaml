# HolmesGPT config for the experiment: Kubernetes read-only tools only.
# Everything else is off so arms stay comparable (same evidence sources as our own agents).
toolsets:
  kubernetes/core:
    enabled: true
  kubernetes/logs:
    enabled: true
  skills:
    enabled: true
  core_investigation:
    enabled: true
  bash:
    enabled: false
  internet:
    enabled: false
  docker/core:
    enabled: false
  connectivity_check:
    enabled: false
  kubernetes/kube-prometheus-stack:
    enabled: false
  kubernetes/live-metrics:
    enabled: false
